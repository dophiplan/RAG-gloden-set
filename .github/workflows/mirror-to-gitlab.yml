name: Mirror to GitLab

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.rsupport.com/individual/nhkim/ai.git
          git push gitlab --all --force
          git push gitlab --tags --force
