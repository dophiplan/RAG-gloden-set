<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 평가 관제판 — 오케스트레이터 v0</title>
<style>
  :root{
    --ink:#12151f; --panel:#1a1f2e; --panel2:#161a27; --line:#2b3247;
    --tx:#dfe3ef; --tx2:#8e96b0;
    --run:#3dd6b0; --human:#e879a8; --input:#d6b23d; --halt:#e85d6f; --doneC:#5a6486;
    --mono:'IBM Plex Mono','Menlo',monospace; --sans:-apple-system,'Apple SD Gothic Neo','IBM Plex Sans KR',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
  .num{font-family:var(--mono)}
  header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.02em}
  .brand small{display:block;font-weight:400;color:var(--tx2);font-size:11px}
  .tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px}
  .tabs button{background:none;border:0;color:var(--tx2);font:inherit;padding:5px 14px;border-radius:6px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--panel);color:var(--tx);font-weight:700}
  .tabs button.addbtn{color:var(--run);font-weight:700}
  .tabs button:focus-visible{outline:2px solid var(--run)}
  .spacer{flex:1}
  .badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--panel2)}
  .dot{width:8px;height:8px;border-radius:50%}
  .ok{background:var(--run)} .off{background:var(--doneC)} .warn{background:var(--input)} .bad{background:var(--halt)}
  .tabbadge{display:inline-block;min-width:16px;font-size:10px;font-family:var(--mono);background:var(--human);color:#2a1020;border-radius:8px;padding:0 5px;margin-left:6px;font-weight:700}
  .tabbadge.inp{background:var(--input)}

  .track-wrap{padding:26px 24px 10px}
  .track-title{font-size:12px;letter-spacing:.06em;color:var(--tx2);margin-bottom:10px}
  .nextbar{background:rgba(61,214,176,.08);border:1px solid rgba(61,214,176,.35);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;color:var(--tx)}
  .aiteam{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin:0 0 10px}
  .aichip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--tx)}
  .aichip.offline{opacity:.5;cursor:default}
  .aichip input{accent-color:var(--doneC);margin:0}
  .airole{color:var(--tx2);font-size:11px}
  .progline{font-family:var(--mono);font-size:12px;color:var(--tx2);margin-top:6px}
  .progline .fail{color:var(--haltC,#e5636f)}
  .track{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding-bottom:14px}
  .stage{position:relative;flex:1;min-width:96px;text-align:center;cursor:pointer;border-radius:8px;padding-top:2px}
  .stage::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
  .stage:first-child::before{display:none}
  .node{position:relative;z-index:1;width:32px;height:32px;margin:0 auto;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--tx2)}
  .stage.done .node{border-color:var(--doneC);color:var(--tx);background:#232a3d}
  .stage.done::before{background:var(--doneC)}
  .stage.gate .node{transform:rotate(45deg);border-radius:6px}
  .stage.gate .node span{display:block;transform:rotate(-45deg)}
  .stage.human .node{border-color:var(--human);color:var(--human);animation:pulse 2.2s infinite}
  .stage.input .node{border-color:var(--input);color:var(--input);animation:pulse 2.2s infinite}
  .stage.run .node{border-color:var(--run);color:var(--run);animation:pulse 2.2s infinite}
  .stage.halt .node{border-color:var(--halt);color:var(--halt)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,178,61,.35)}50%{box-shadow:0 0 0 9px rgba(214,178,61,0)}}
  @media (prefers-reduced-motion: reduce){.stage .node{animation:none!important}}
  .s-name{margin-top:9px;font-size:12px;font-weight:500}
  .s-state{font-size:10px;letter-spacing:.06em;margin-top:2px}
  .st-done{color:var(--doneC)} .st-run{color:var(--run)} .st-human{color:var(--human)} .st-input{color:var(--input)} .st-halt{color:var(--halt)} .st-none{color:#3a4158}
  .stage:hover .s-name,.stage.tipon .s-name{color:var(--run)}
  .stage:focus-visible{outline:2px solid var(--run);outline-offset:-2px}

  /* 트랙 툴팁 — body 직속 fixed 팝오버 */
  .tip{display:none;position:fixed;z-index:9999;width:372px;max-height:78vh;overflow-y:auto;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 44px rgba(0,0,0,.62)}
  .tip.show{display:block}
  .tip .th{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .gatechip{font-size:10px;color:var(--human);border:1px solid var(--human);border-radius:6px;padding:1px 7px;white-space:nowrap}
  .tip .tb{padding:12px 14px}
  .tip .what{font-size:12px;color:var(--tx);line-height:1.65;margin-bottom:11px}
  .io{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:11.5px;margin-bottom:11px}
  .io .k{color:var(--tx2);white-space:nowrap} .io .v{color:var(--tx)}
  .io .tool{color:var(--run);font-family:var(--mono);font-size:11px}
  .files{border-top:1px dashed var(--line);padding-top:9px}
  .files .fh{font-size:10px;letter-spacing:.1em;color:var(--tx2);margin-bottom:6px}
  .frow{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:3px 0}
  .frow .star{color:var(--input);width:10px}
  .frow .fn{flex:1;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .dl{color:var(--run);text-decoration:none;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 7px}
  .frow .dl:focus-visible{outline:2px solid var(--run)}
  .frow .sz{color:var(--tx2);font-family:var(--mono);font-size:10px}
  .nonef{font-size:11.5px;color:var(--tx2);font-style:italic}
  .arch{margin-top:7px;border:1px dashed var(--line);border-radius:8px;padding:2px 9px;background:rgba(255,255,255,.02)}
  .arch summary{cursor:pointer;font-size:11px;color:var(--tx2);padding:5px 0;list-style:none;display:flex;align-items:center;gap:6px;user-select:none}
  .arch summary::-webkit-details-marker{display:none}
  .arch summary::before{content:'▸';transition:transform .15s;color:var(--tx2)}
  .arch[open] summary::before{transform:rotate(90deg)}
  .arch .frow{opacity:.75}

  main{display:grid;grid-template-columns:1fr 320px 300px;gap:16px;padding:8px 24px 20px}
  @media(max-width:1100px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .p-head{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.1em;color:var(--tx2);display:flex;justify-content:space-between;align-items:center}
  .p-body{padding:14px 16px}
  .card{border:1px solid var(--line);border-left:3px solid var(--input);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:var(--panel2)}
  .card.human-card{border-left-color:var(--human)}
  .card h4{font-size:13px;margin-bottom:4px}
  .card .meta{font-size:11px;color:var(--tx2);margin-bottom:8px}
  .card .evidence{font-family:var(--mono);font-size:11.5px;background:var(--ink);border-radius:6px;padding:8px 10px;margin-bottom:9px;white-space:pre-wrap;max-height:320px;overflow-y:auto}
  .ackrow label{flex:1}
  .ackrow{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--tx2);margin:3px 0}
  .ackrow input{accent-color:var(--human);margin-top:3px}
  .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{font:inherit;font-size:12px;font-weight:700;border-radius:7px;padding:6px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
  .btn.approve{border-color:var(--run);color:var(--run)}
  .btn.approve:disabled{opacity:.4;cursor:not-allowed}
  .btn.reject{border-color:var(--halt);color:var(--halt)}
  .btn:focus-visible{outline:2px solid var(--tx)}
  .hint{font-size:10px;color:var(--tx2)}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .kv .cell{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .cell .k{font-size:11px;color:var(--tx2)}
  .cell .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:2px;word-break:break-all}
  .cell .v small{font-size:11px;color:var(--tx2);font-weight:400}
  .note{font-size:12px;color:var(--tx2);border-left:2px solid var(--line);padding-left:10px;margin-top:6px;white-space:pre-wrap}
  .score-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px;gap:8px}
  .score-row:last-child{border-bottom:0}
  .score-row .num{font-size:13px;font-weight:600}
  .trend{font-family:var(--mono);color:var(--tx2);font-size:11px}
  .warnbadge{display:inline-block;font-size:10px;color:var(--input);border:1px solid var(--input);border-radius:5px;padding:1px 7px;margin-left:6px}
  .haltbadge{display:inline-block;font-size:10px;color:var(--halt);border:1px solid var(--halt);border-radius:5px;padding:1px 7px;margin-left:6px}
  .ledger-wrap{padding:0 24px 24px}
  .ledger .p-body{font-family:var(--mono);font-size:11.5px;line-height:1.9;color:var(--tx2);max-height:170px;overflow-y:auto}
  .lg-row b{color:var(--tx);font-weight:600}
  .lg-appeal{color:var(--human)} .lg-halt{color:var(--halt)} .lg-script{color:var(--run)}
  dialog{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:0;max-width:430px;width:92%}
  dialog::backdrop{background:rgba(6,8,14,.72)}
  .dlg-head{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700}
  .dlg-body{padding:18px 20px}
  .dlg-body label{display:block;font-size:12px;color:var(--tx2);margin:12px 0 4px}
  .dlg-body input,.dlg-body select,.dlg-body textarea{width:100%;font:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:9px 12px}
  .dlg-body input:focus-visible,.dlg-body select:focus-visible,.dlg-body textarea:focus-visible{outline:2px solid var(--run)}
  .dlg-steps{font-size:12px;color:var(--tx2);background:var(--ink);border-radius:8px;padding:10px 13px;margin-top:14px;line-height:1.9}
  .dlg-steps b{color:var(--tx)}
  .dlg-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .toast{position:fixed;bottom:18px;right:18px;z-index:10000;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:12px;max-width:420px;white-space:pre-wrap;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
</style>
</head>
<body>

<header>
  <div class="brand">RAG 평가 관제판<small>오케스트레이터 v0 · 실데이터</small></div>
  <div class="tabs" role="tablist" aria-label="제품" id="tabs"></div>
  <div class="spacer"></div>
  <div class="badge" id="modeBadge"></div>
  <div class="badge" id="calBadge"></div>
  <div class="badge" id="killBadge"></div>
</header>

<section id="view"></section>
<div class="ledger-wrap">
  <div class="panel ledger">
    <div class="p-head">원장 테일 — ledger.jsonl (append-only · 읽기 전용)<span class="hint" id="ledgerCount"></span></div>
    <div class="p-body" id="ledger"></div>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-head">새 제품 평가 시작하기</div>
  <div class="dlg-body">
    <label for="f-code">제품 코드 (영문 대문자 짧게)</label>
    <input id="f-code" placeholder="예: RM" maxlength="8">
    <label for="f-name">제품 이름</label>
    <input id="f-name" placeholder="예: 리모트미팅">
    <label for="f-start">무엇부터 시작하나요?</label>
    <select id="f-start">
      <option value="full">처음부터 — 코퍼스(문서 뭉치)로 시험지 제작</option>
      <option value="scoring">채점만 — 골든셋(시험지)과 응답 로그가 이미 있음</option>
    </select>
    <label for="f-base">채점 규칙, 어느 제품과 비슷하게 시작할까요?</label>
    <select id="f-base">
      <option value="RV">리모트뷰(RV)와 비슷하게</option>
      <option value="RC">리모트콜(RC)과 비슷하게</option>
      <option value="blank">잘 모르겠어요 (나중에 ② 단계에서 정함)</option>
    </select>
    <div class="dlg-steps"><b>이건 순서 선택이 아니에요</b> — 어디서 시작할지는 올리는 파일이 정해요:<br>
      · 문서 뭉치(코퍼스)만 → <b>처음부터</b> 시험지 제작<br>
      · 골든셋(시험지)이 이미 있음 → 해당 단계 폴더에 넣으면 <b>건너뜀</b><br>
      · 응답 로그까지 있음 → <b>채점만</b> 진행<br>
      추가하면: 폴더 만들어지고 → "파일 올려주세요" 카드가 떠요 (📎 업로드 버튼)</div>
  </div>
  <div class="dlg-foot">
    <button class="btn" onclick="dlg.close()">취소</button>
    <button class="btn approve" onclick="doOnboard()">추가</button>
  </div>
</dialog>

<dialog id="rdlg">
  <div class="dlg-head">반려 — 사유 필수 (원장 기록)</div>
  <div class="dlg-body">
    <label for="r-reason">반려 사유</label>
    <textarea id="r-reason" rows="3" placeholder="실측 근거를 포함해 주세요"></textarea>
  </div>
  <div class="dlg-foot">
    <button class="btn" onclick="rdlg.close()">취소</button>
    <button class="btn reject" onclick="doReject()">반려 확정</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const STAGE_ORDER = ["CORPUS_AUDIT","TERRAIN","COVERAGE_MAP","GOLDENSET_BATCH","UNIFIED_LEDGER","CALIBRATION","STAGE2","SCORING","MAINTENANCE"];
const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
const GATE_DIAMOND = new Set(["CALIBRATION"]);
// U3: 상태는 전부 한글로
const STATUS_KO = {RUNNING:'진행 중', WAITING_HUMAN:'결정 대기 (내 차례)', WAITING_INPUT:'파일 대기',
                   PENDING:'대기', HALTED:'⛔ 사고 정지', REJECTED:'반려 — 재제출 대기', DONE:'완료'};
let S = {state:null, catalog:null, queue:null, scores:null, ledger:null};
let cur = null, rejectTarget = null, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const kb = n => n>=1048576?(n/1048576).toFixed(1)+'MB':(n/1024).toFixed(1)+'KB';
// U1: 화면의 주체 = 제품(display). 내부 트랙 코드는 이 두 헬퍼 뒤로 숨긴다.
const PV = () => S.state._products[cur];          // {code, name, gen, legacy[]}
const PS = () => S.state.products[PV().code];     // 현역 트랙 상태

async function loadAll(){
  const [st,cat,q,sc,lg,ai] = await Promise.all([
    fetch('/api/state').then(r=>r.json()),
    fetch('/api/catalog').then(r=>r.json()),
    fetch('/api/queue').then(r=>r.json()),
    fetch('/api/scores').then(r=>r.json()),
    fetch('/api/ledger').then(r=>r.json()),
    fetch('/api/ai_status').then(r=>r.json()),
  ]);
  S = {state:st, catalog:cat, queue:q, scores:sc, ledger:lg, ai};
  const disp = Object.keys(st._products||{});
  if(!cur || !st._products[cur]) cur = disp[0];
  render();
}

function stageView(code){
  const ps = S.state.products[code];
  const hist = ps.stage_history||{};
  const curIdx = STAGE_ORDER.indexOf(ps.stage);
  return STAGE_ORDER.map((k,i)=>{
    if(hist[k] && (i<curIdx || ps.status==='DONE')) return {k, cls:'done', label:'완료'};
    if(i===curIdx){
      const map = {RUNNING:['run','진행 중'], WAITING_HUMAN:['human','결정 대기'],
                   WAITING_INPUT:['input','파일 대기'], HALTED:['halt','사고 정지'],
                   PENDING:['none','대기'], REJECTED:['human','반려'], DONE:['done','완료']};
      const [cls,label] = map[ps.status]||['none',ps.status];
      return {k, cls, label};
    }
    return {k, cls:'', label:'—'};
  });
}

// U4: "지금 할 일" 한 줄 — 화면이 먼저 말해준다
function nextAction(){
  const ps = PS(), code = PV().code;
  const myCards = S.queue.filter(c=>c.product===code);
  if(busy) return {icon:'⏳', text:'AI 작업 중… 실전 모드에서는 몇 분 걸릴 수 있어요. 이 화면 그대로 두세요.'};
  if(ps.status==='HALTED') return {icon:'⛔', text:'사고 정지 상태예요 — 원인: '+(ps.halt_reason||'원장 확인')+'. 저(Claude)를 불러주세요.'};
  if(ps.status==='WAITING_INPUT'){
    const c = myCards.find(c=>c.kind==='INPUT');
    return {icon:'📎', text:'지금 할 일: 왼쪽 카드의 [파일 업로드] 버튼으로 '+(c? c.title.replace(/INPUT_[A-Z_0-9]+ — /,'') : '필요한 파일')+' 파일을 올려주세요. 올리면 자동으로 진행돼요.'};
  }
  if(ps.status==='WAITING_HUMAN') return {icon:'🙋', text:'지금 할 일: 왼쪽 카드를 읽고 [승인] 또는 [반려]를 눌러주세요. ('+myCards.length+'건 대기)'};
  if(ps.status==='RUNNING') return {icon:'⚙️', text:'시스템이 일하는 중 — 잠시 후 자동으로 갱신됩니다.'};
  if(ps.status==='DONE') return {icon:'🎉', text:'이 제품의 현재 사이클이 끝났어요.'};
  return {icon:'▶', text:'대기 중 — 파일이 준비되면 업로드로 시작하세요.'};
}

function render(){
  const st = S.state;
  // U1: 탭 = 제품 (RV·RC) — 내부 코드 숨김
  $('tabs').innerHTML = Object.entries(st._products).map(([disp,pv])=>{
    const q = S.queue.filter(c=>c.product===pv.code);
    const human = q.some(c=>c.kind==='GATE');
    const badge = q.length?`<span class="tabbadge ${human?'':'inp'}">${q.length}</span>`:'';
    return `<button role="tab" aria-selected="${disp===cur}" onclick="cur='${disp}';render()">${disp} ${esc(pv.name)}${badge}</button>`;
  }).join('') + `<button class="addbtn" aria-label="제품 추가" onclick="dlg.showModal()">＋ 제품</button>`;
  // U2: 모드 배지 — 지금 가짜인지 진짜인지 크게
  const md = st._mode||{};
  const modeColor = md.cls==='live'?'ok':(md.cls==='practice'?'warn':'bad');
  $('modeBadge').innerHTML = `<span class="dot ${modeColor}"></span><b>${esc(md.label||'?')}</b>`;
  const ps = PS();
  $('calBadge').innerHTML = `<span class="dot ${ps.calibration_passed?'ok':'warn'}"></span>채점관 면접 ${ps.calibration_passed?'통과':'전 (본채점 잠김)'}`;
  const hc = st._halt_count;
  $('killBadge').innerHTML = `<span class="dot ${hc?'bad':'off'}"></span>${hc?`사고 정지 ${hc}건`:'사고 0 · 정상'}`;

  const stages = stageView(PV().code);
  const stCls = {done:'st-done',run:'st-run',human:'st-human',input:'st-input',halt:'st-halt','':'st-none',none:'st-none'};
  const catStages = (S.catalog.products[cur]||{stages:[]}).stages;
  const na = nextAction();
  const legacyLine = (PV().legacy||[]).map(l=>esc(l.gen)).join(' · ');
  const strat = ps.strategy || 'ensemble';
  const stratSel = `<select id="stratSel" onchange="setStrategy(this.value)" style="font:inherit;font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--tx);padding:4px 8px;margin-left:12px">
      <option value="ensemble" ${strat==='ensemble'?'selected':''}>제작 방식: 앙상블 — AI 전원이 각자 만들고 병합 (촘촘)</option>
      <option value="cross_check" ${strat==='cross_check'?'selected':''}>제작 방식: 1개가 만들고 다른 AI가 검수</option>
      <option value="self_check" ${strat==='self_check'?'selected':''}>제작 방식: 1개가 만들고 새 세션에서 자가 검수</option>
      <option value="solo" ${strat==='solo'?'selected':''}>제작 방식: AI 1개 단독 (빠름·저비용)</option>
    </select>`;
  let html = `
  <div class="track-wrap">
    <div class="track-title">${esc(PV().name)} (${cur}) — 현역: <b style="color:var(--tx)">${esc(PV().gen)}</b>${legacyLine?` · 이전 세대: ${legacyLine}`:''}${stratSel}</div>
    ${renderAiTeam()}
    <div class="nextbar">${na.icon} ${esc(na.text)}<div class="progline" id="progline" style="display:none"></div></div>
    <div class="track" id="track">${stages.map((s,i)=>{
      const gate = GATE_DIAMOND.has(s.k)?'gate '+(s.cls==='done'?'':'human'):'';
      return `<div class="stage ${s.cls} ${gate}" tabindex="0" role="button" data-i="${i}"
        aria-label="${CIRC[i]} ${catStages[i]?catStages[i].name:''} — ${s.label}">
        <div class="node"><span>${CIRC[i]}</span></div>
        <div class="s-name">${catStages[i]?catStages[i].name:s.k}</div>
        <div class="s-state ${stCls[s.cls]||'st-none'}">${s.label}</div>
      </div>`;}).join('')}
    </div>
  </div>
  <main>
    <div class="panel"><div class="p-head">내가 할 일 (검수큐) <span class="num">${S.queue.filter(c=>c.product===PV().code).length}건</span></div><div class="p-body" id="queuebody">
      ${renderQueue()}
    </div></div>
    <div class="panel"><div class="p-head">현재 단계 — ${CIRC[STAGE_ORDER.indexOf(ps.stage)]} ${catStages[STAGE_ORDER.indexOf(ps.stage)]?.name||ps.stage} · ${STATUS_KO[ps.status]||ps.status}</div><div class="p-body">
      ${renderDetail(ps)}
    </div></div>
    <div class="panel"><div class="p-head">성적 히스토리 — ${cur} <span class="hint">실측</span></div><div class="p-body">
      ${renderScores(ps)}
    </div></div>
  </main>`;
  $('view').innerHTML = html;
  document.querySelectorAll('.stage').forEach(el=>{
    const i = +el.dataset.i;
    el.addEventListener('mouseenter',()=>showTip(el,i));
    el.addEventListener('focusin',()=>showTip(el,i));
    el.addEventListener('mouseleave',scheduleHide);
    el.addEventListener('focusout',scheduleHide);
  });
  renderLedger();
}

function renderQueue(){
  const code = PV().code;
  const cards = S.queue.filter(c=>c.product===code);
  if(!cards.length) return `<div class="note">할 일 없음 — 시스템이 알아서 진행하거나 외부 재료를 기다리는 중이에요.</div>`;
  return cards.map((c,ci)=>{
    const bodyMain = c.body.split('## 재개')[0].split('\n').slice(2).join('\n').trim();
    const acks = c.acks.map((a,ai)=>`<div class="ackrow"><input type="checkbox" id="ack_${ci}_${ai}" onchange="ackCheck(${ci})"><label for="ack_${ci}_${ai}">${esc(a)}</label></div>`).join('');
    const btns = c.kind==='GATE' ? `<div class="btns">
        <button class="btn approve" id="apr_${ci}" ${c.acks.length?'disabled':''} onclick="doApprove('${c.id}',${c.acks.length})">승인</button>
        <button class="btn reject" onclick="openReject('${c.id}')">반려 (사유 필수)</button>
      </div>${c.acks.length?`<div class="hint">체크리스트 전부 확인(체크)해야 승인 버튼이 켜져요</div>`:''}` : `<div class="btns">
        <label class="btn approve" style="cursor:pointer">📎 파일 업로드<input type="file" multiple style="display:none" onchange="doUpload(this,'${c.id}')"></label>
      </div><div class="hint">파일을 올리면 자동으로: 저장 → 검사 → 다음 단계 진행</div>`;
    return `<div class="card ${c.kind==='GATE'?'human-card':''}">
      <h4>${esc(c.title)}</h4>
      <div class="meta">${c.kind==='GATE'?'🙋 결정해 주세요':'📎 파일을 올려주세요'} · ${esc(c.file)}</div>
      <div class="evidence">${esc(bodyMain.slice(0,900))}</div>
      ${acks}${btns}</div>`;
  }).join('');
}

function ackCheck(ci){
  const card = document.querySelectorAll('#queuebody .card')[ci];
  const boxes = card.querySelectorAll('input[type=checkbox]');
  const all = [...boxes].every(b=>b.checked);
  const btn = card.querySelector('.btn.approve');
  if(btn) btn.disabled = !all;
}

function renderDetail(ps){
  const i = STAGE_ORDER.indexOf(ps.stage);
  const cs = (S.catalog.products[cur]||{stages:[]}).stages[i];
  const files = (cs? cs.files : []).filter(f=>!f.gen);   // 은퇴분은 보관함 — 산출물 수에 안 섞음
  const kv = [
    ["보유 산출물", `${files.length} <small>개</small>`],
    ["채점관 면접", ps.calibration_passed?'통과':'전 <small>본채점 잠김</small>'],
    ["열린 결정", `${ps.open_gates.length}`],
    ["회차 비교", ps.compare_blocked?'차단 <small>재채점 중</small>':'허용'],
  ];
  const note = cs? `${cs.what}\n\n쓰는 파일: ${cs.consumes.join(' · ')}\n만드는 파일: ${cs.produces.join(' · ')}` : '';
  return `<div class="kv">${kv.map(([k,v])=>`<div class="cell"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
    ${ps.halt_reason?`<div class="note" style="border-left-color:var(--halt);color:var(--halt)">⛔ ${esc(ps.halt_reason)}</div>`:''}
    <div class="note">${esc(note)}</div>`;
}

// U6: 성적 히스토리 — 현역 + 이전 세대를 한 탭에서
function renderScores(ps){
  const pv = PV();
  const sections = [];
  const mk = (label, sc, retired) => {
    if(!sc || !Object.keys(sc).length) return '';
    const rounds = Object.keys(sc).sort();
    const last = sc[rounds[rounds.length-1]];
    const trend = k => rounds.map(r=>sc[r][k]).join('→');
    return `<div class="score-row"><span><b>${esc(label)}</b></span><span class="trend">${rounds.join(' · ')}</span>
        <span>${retired?'<span class="haltbadge">키 공개 후 참고</span>':'<span class="hint">현역</span>'}</span></div>`
      + [["top1",'top1'],["top5",'top5'],["생성 pass",'pass'],["E환각",'E환각']]
        .map(([nm,k])=>`<div class="score-row"><span style="padding-left:10px">${nm}</span><span class="trend">${trend(k)}</span><span class="num">${last[k]}</span></div>`).join('');
  };
  sections.push(mk(pv.gen.split(' — ')[0], S.scores[pv.code], false));
  for(const lg of (pv.legacy||[])) sections.push(mk(lg.gen.split(' — ')[0].split(' · ')[0], S.scores[lg.code], true));
  const body = sections.filter(Boolean).join('<div style="height:10px"></div>');
  return body || `<div class="note">아직 성적 없음 — 실물 채점 후 여기에 회차별로 쌓여요. (실측 전에는 아무 숫자도 안 보여주는 게 원칙)</div>`;
}

function renderLedger(){
  const rows = S.ledger.map(r=>{
    const cls = r.stage==='APPEAL'||r.action==='appeal' ? 'lg-appeal'
      : (r.action||'').includes('HALT')||(r.action||'').includes('REFUSED')||(r.action||'').includes('LEAK') ? 'lg-halt' : '';
    const actor = (r.actor||'').startsWith('script') ? `<span class="lg-script">${esc(r.actor)}</span>` : esc(r.actor);
    const ev = r.evidence && Object.keys(r.evidence).length ? ` · ${esc(JSON.stringify(r.evidence)).slice(0,110)}` : '';
    return `<div class="lg-row ${cls}">${esc((r.ts||'').slice(5,16))} <b>${esc(r.stage)}${r.product?'·'+esc(r.product):''}</b> · ${actor} · ${esc(r.action)}${r.reason?' · '+esc(r.reason).slice(0,80):''}${ev}</div>`;
  }).join('');
  $('ledger').innerHTML = rows || '(운영 기록 시작 — 여기에 모든 결정이 자동으로 남아요)';
  $('ledgerCount').textContent = `최근 ${S.ledger.length}행`;
}

/* 트랙 툴팁 */
const tip = document.createElement('div'); tip.className='tip'; document.body.appendChild(tip);
let hideT=null;
tip.addEventListener('mouseenter',()=>clearTimeout(hideT));
tip.addEventListener('mouseleave',scheduleHide);
function showTip(el,i){
  clearTimeout(hideT);
  const cs = (S.catalog.products[cur]||{stages:[]}).stages[i];
  if(!cs) return;
  // 현역은 바로, 은퇴는 세대별 📦 보관함(아코디언)으로 — 여러 세대가 쌓여도 접혀 있어요
  const frow = f=>`<div class="frow"><span class="star">${f.canonical&&!f.gen?'★':''}</span><span class="fn" title="${esc(f.file)}">${esc(f.file)}</span><span class="sz">${kb(f.size)}</span><a class="dl" href="/data/${encodeURI(f.path||'')}" download>받기</a></div>`;
  const curF = cs.files.filter(f=>!f.gen), oldF = cs.files.filter(f=>f.gen);
  const groups = {};
  oldF.forEach(f=>(groups[f.gen]=groups[f.gen]||[]).push(f));
  const files = (curF.map(frow).join('') || '<div class="nonef">아직 자료 없음 — 이 단계 미도달</div>')
    + Object.entries(groups).map(([g,fl])=>`<details class="arch"><summary>📦 보관함 · ${esc(g)} — ${fl.length}개 (안 쓰는 자료)</summary>${fl.map(frow).join('')}</details>`).join('');
  tip.innerHTML = `<div class="th"><span>${CIRC[i]} ${esc(cs.name)}</span>${cs.gate?`<span class="gatechip">${esc(cs.gate)} 게이트</span>`:''}</div>
    <div class="tb"><div class="what">${esc(cs.what)}</div>
      <div class="io"><span class="k">쓰는 파일</span><span class="v">${cs.consumes.map(esc).join(' · ')}</span>
        <span class="k">만드는 파일</span><span class="v">${cs.produces.map(esc).join(' · ')}</span></div>
      <div class="files"><div class="fh">보유 자료 ${curF.length}${oldF.length?` · 보관함 ${oldF.length}`:''}</div>${files}</div></div>`;
  tip.classList.add('show');
  const r = el.querySelector('.node').getBoundingClientRect();
  const tw=tip.offsetWidth, th=tip.offsetHeight, vw=innerWidth, vh=innerHeight;
  let left=Math.max(8,Math.min(r.left+r.width/2-tw/2, vw-tw-8));
  let top=r.bottom+12; if(top+th>vh-8) top=Math.max(8,r.top-th-12);
  tip.style.left=left+'px'; tip.style.top=top+'px';
}
function scheduleHide(){hideT=setTimeout(()=>tip.classList.remove('show'),180);}

/* 액션 — U5: 처리 중 표시 */
function toast(msg, ms=6000){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); if(ms) t._t=setTimeout(()=>t.style.display='none', ms);
}
async function act(payload){
  busy = true; render();
  toast('⏳ 처리 중… (실전 모드에서는 AI 작업에 몇 분 걸릴 수 있어요)', 0);
  if(payload.cmd==='run') startProgressPoll();   // G15: AI 작업 중 진행/막힘 표시
  try{
    const r = await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const d = await r.json();
    toast(d.out || (d.ok?'완료':'실패'));
    return d;
  } finally {
    stopProgressPoll();
    busy = false;
    await loadAll();
  }
}
async function doApprove(id, nAcks){
  await act({cmd:'approve', gate_id:id, ack_all:nAcks>0});
  await act({cmd:'run', product:PV().code});
}
function openReject(id){ rejectTarget=id; $('r-reason').value=''; rdlg.showModal(); }
async function doReject(){
  const reason = $('r-reason').value.trim();
  if(!reason){ $('r-reason').focus(); return; }
  rdlg.close();
  await act({cmd:'reject', gate_id:rejectTarget, reason});
}
async function doUpload(input, cardId){
  const files=[...input.files];
  if(!files.length) return;
  busy = true; render();
  toast(`⏳ 업로드 중… (${files.length}개)`, 0);
  try{
    for(const f of files){
      const r=await fetch(`/api/upload?product=${PV().code}&target=${encodeURIComponent(cardId)}&name=${encodeURIComponent(f.name)}`,
        {method:'POST', body:f});
      const d=await r.json();
      toast(d.out||'업로드 실패');
      if(!d.ok){ busy=false; await loadAll(); return; }
    }
  } finally { busy = false; }
  await act({cmd:'run', product:PV().code});
}
async function setStrategy(v){
  await act({cmd:'set-strategy', product:PV().code, strategy:v});
}

/* G15: AI 팀 패널 — 누가 연결됐고(🟢/⚪) 이번 제작에 누굴 투입할지(체크) */
function renderAiTeam(){
  const ai = S.ai;
  if(!ai || !ai.engines) return '';
  const pv = ai.products[cur]||{};
  const use = pv.ai_use || {};
  const strat = pv.strategy || 'ensemble';
  const chips = ai.engines.map(e=>{
    const lock = e.role==='generator';                       // 대표(출제)는 항상 참여
    const checked = e.connected && use[e.role]!==false;
    // 앙상블: 전원이 '추출'을 겸한다 — 라벨에 명시 (그 외 전략은 본업만)
    const duty = strat==='ensemble' ? '추출 + '+e.role_ko : e.role_ko;
    return `<label class="aichip ${e.connected?'':'offline'}" title="${esc(e.how)}${lock?' · 대표 AI는 항상 참여':''}">
      <input type="checkbox" data-role="${e.role}" ${checked?'checked':''} ${(!e.connected||lock)?'disabled':''} onchange="toggleMember()">
      <span class="dot ${e.connected?'ok':'off'}"></span><b>${esc(e.engine)}</b><span class="airole">${esc(duty)}</span>
    </label>`;
  }).join('');
  const HOW = {ensemble:'앙상블: 체크된 AI 전원이 각자 추출 → claude가 병합 (합집합이라 촘촘)',
               cross_check:'claude가 만들고, 다른 AI가 검수',
               self_check:'claude가 만들고, 새 세션에서 자가 검수',
               solo:'claude 단독 제작'};
  return `<div class="aiteam">AI 팀 ${chips}<span class="hint">🟢 연결 · ⚫ 미연결 — ${HOW[strat]||''}</span></div>`;
}
async function toggleMember(){
  const roles=[...document.querySelectorAll('.aichip input[data-role]')]
    .filter(i=>i.checked).map(i=>i.dataset.role);
  await act({cmd:'set-members', product:PV().code, use:roles.join(',')||'generator'});
}

/* G15: 진행/막힘 실시간 — AI 작업(run) 중 4초마다 진행 파일 폴링 */
let progT = null;
function engName(role){
  const e=(S.ai&&S.ai.engines||[]).find(x=>x.role===role);
  return e? e.engine : role;
}
function startProgressPoll(){
  stopProgressPoll();
  progT = setInterval(async ()=>{
    try{
      const d = await fetch('/api/progress?product='+PV().code).then(r=>r.json());
      const el = $('progline');
      if(!d.active || !el) return;
      const parts = Object.entries(d.roles||{}).map(([r,v])=>{
        let s = `${engName(r)} ${v.batch}/${v.total} 배치`;
        if((v.fails||[]).length) s += ` <span class="fail">· 실패 ${v.fails.length}건(원장 기록)</span>`;
        return s;
      });
      el.style.display='block';
      el.innerHTML = `📡 ${esc(d.phase||'작업 중')}${parts.length?' — '+parts.join(' · '):''} <span class="hint">(${esc(d.ts||'')})</span>`;
    }catch(e){}
  }, 4000);
}
function stopProgressPoll(){ if(progT){clearInterval(progT); progT=null;} }
async function doOnboard(){
  const code=$('f-code').value.trim().toUpperCase(), name=$('f-name').value.trim();
  if(!code){$('f-code').focus();return;}
  dlg.close();
  await act({cmd:'onboard', product:code, name, base:$('f-base').value, start:$('f-start').value});
  cur=null; await loadAll();
}
const dlg=$('dlg'), rdlg=$('rdlg');

loadAll();
setInterval(()=>{ if(!busy) loadAll(); }, 15000);
</script>
</body>
</html>
