<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M0-3 보강 Demo - 크기/비율</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: #333;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 { margin: 0; font-size: 18px; }
    
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .toolbar {
      width: 300px;
      background: white;
      border-right: 1px solid #ddd;
      padding: 16px;
      overflow-y: auto;
    }
    
    .toolbar h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
    }
    
    .tool-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    
    .tool-section:last-child { border-bottom: none; }
    
    button {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      margin: 4px 4px 4px 0;
    }
    
    button:hover:not(:disabled) { background: #f0f0f0; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: #007bff; color: white; border-color: #007bff; }
    button.primary:hover:not(:disabled) { background: #0056b3; }
    button.danger { background: #dc3545; color: white; border-color: #dc3545; }
    button.danger:hover:not(:disabled) { background: #c82333; }
    button.success { background: #28a745; color: white; border-color: #28a745; }
    button.success:hover:not(:disabled) { background: #218838; }
    
    .input-group { margin-bottom: 10px; }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    .input-group input,
    .input-group select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .size-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .size-input-row .input-group { flex: 1; }
    .size-input-row select { width: 100px; }
    
    .info-box {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #666;
    }
    
    .canvas-area {
      flex: 1;
      padding: 20px;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    
    #canvas {
      background: white;
      border: 2px solid #ddd;
      border-radius: 8px;
      min-height: 500px;
      padding: 20px;
      flex: 1;
    }
    
    .canvas-placeholder {
      color: #999;
      text-align: center;
      padding: 100px 20px;
    }
    
    .tree-panel {
      width: 280px;
      background: white;
      border-left: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    
    .tree-panel h3 {
      margin: 0;
      padding: 16px;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }
    
    #tree-view {
      flex: 1;
      padding: 16px;
      overflow: auto;
      font-family: "Monaco", "Menlo", monospace;
      font-size: 11px;
      line-height: 1.4;
    }
    
    .status-bar {
      background: #f8f9fa;
      border-top: 1px solid #ddd;
      padding: 8px 16px;
      font-size: 12px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    
    .example-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .example-buttons button {
      font-size: 11px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎨 M0-3 보강: 크기/비율 (레고식 자유)</h1>
    <span>고정 | 꽉채움 | 비율(%) | 내용맞춤</span>
  </div>
  
  <div class="main">
    <div class="toolbar">
      <!-- 프레임 추가 -->
      <div class="tool-section">
        <h3>📦 프레임</h3>
        <button class="primary" onclick="addContainer()">+ 빈 상자</button>
        <div class="info-box" style="margin-top: 8px;">
          선택된 상자 안에 추가됨
        </div>
      </div>
      
      <!-- 요소 추가 -->
      <div class="tool-section">
        <h3>📝 요소 추가</h3>
        <div id="add-elements-buttons">
          <button onclick="addText()" disabled>+ 텍스트</button>
          <button onclick="addButton()" disabled>+ 버튼</button>
          <button onclick="addInputField()" disabled>+ 입력칸</button>
        </div>
      </div>
      
      <!-- 크기 설정 (M0-3 보강) -->
      <div class="tool-section" id="size-panel" style="display: none;">
        <h3>📐 크기 설정</h3>
        
        <!-- 가로 크기 -->
        <div class="input-group">
          <label>가로 (width)</label>
          <div class="size-input-row">
            <select id="width-mode" onchange="onWidthModeChange()">
              <option value="내용맞춤">내용맞춤</option>
              <option value="고정">고정(px)</option>
              <option value="꽉채움">꽉채움</option>
              <option value="비율">비율(%)</option>
            </select>
            <div class="input-group" id="width-value-group" style="display: none; margin-bottom: 0;">
              <input type="number" id="width-value" onchange="updateWidth()" placeholder="값">
            </div>
          </div>
        </div>
        
        <!-- 세로 크기 -->
        <div class="input-group">
          <label>세로 (height)</label>
          <div class="size-input-row">
            <select id="height-mode" onchange="onHeightModeChange()">
              <option value="내용맞춤">내용맞춤</option>
              <option value="고정">고정(px)</option>
              <option value="꽉채움">꽉채움</option>
              <option value="비율">비율(%)</option>
            </select>
            <div class="input-group" id="height-value-group" style="display: none; margin-bottom: 0;">
              <input type="number" id="height-value" onchange="updateHeight()" placeholder="값">
            </div>
          </div>
        </div>
      </div>
      
      <!-- 순서/삭제 -->
      <div class="tool-section">
        <h3>🔃 순서 / 🗑️ 삭제</h3>
        <button onclick="moveUp()" id="btn-move-up" disabled>⬆️ 위로</button>
        <button onclick="moveDown()" id="btn-move-down" disabled>⬇️ 아래로</button>
        <button class="danger" onclick="deleteSelected()" id="btn-delete" disabled>삭제</button>
      </div>
      
      <!-- 속성 편집 -->
      <div class="tool-section" id="properties-panel" style="display: none;">
        <h3>⚙️ 속성</h3>
        
        <div class="input-group">
          <label>이름</label>
          <input type="text" id="prop-name" onchange="updateName(this.value)">
        </div>
        
        <div id="text-properties" style="display: none;">
          <div class="input-group">
            <label>내용</label>
            <input type="text" id="prop-text-content" onchange="updateTextContent(this.value)">
          </div>
          <div class="input-group">
            <label>글자 크기</label>
            <input type="number" id="prop-text-size" onchange="updateTextFontSize(this.value)">
          </div>
        </div>
        
        <div id="input-properties" style="display: none;">
          <div class="input-group">
            <label>라벨</label>
            <input type="text" id="prop-input-label" onchange="updateInputLabel(this.value)">
          </div>
        </div>
        
        <div id="container-properties" style="display: none;">
          <div class="input-group">
            <label>방향</label>
            <select id="prop-layout-direction" onchange="updateLayoutDirection(this.value)">
              <option value="vertical">세로</option>
              <option value="horizontal">가로</option>
            </select>
          </div>
          <div class="input-group">
            <label>정렬</label>
            <select id="prop-layout-align" onchange="updateLayoutAlign(this.value)">
              <option value="start">시작</option>
              <option value="center">가운데</option>
              <option value="end">끝</option>
            </select>
          </div>
          <div class="input-group">
            <label>간격 (px)</label>
            <input type="number" id="prop-layout-gap" onchange="updateLayoutGap(this.value)">
          </div>
          <div class="input-group">
            <label>안쪽 여백 (px)</label>
            <input type="number" id="prop-layout-padding" onchange="updateLayoutPadding(this.value)">
          </div>
          <div class="input-group">
            <label>배경색</label>
            <input type="color" id="prop-container-bg" onchange="updateContainerBg(this.value)">
          </div>
        </div>
      </div>
      
      <!-- 예시 로드 -->
      <div class="tool-section">
        <h3>🔄 예시 불러오기</h3>
        <div class="example-buttons">
          <button onclick="loadSidebarExample()">사이드바(30:70)</button>
          <button onclick="loadHeaderExample()">헤더+본문+푸터</button>
          <button onclick="loadLoginExample()">로그인</button>
          <button onclick="resetToEmpty()">빈 캔버스</button>
        </div>
      </div>
    </div>
    
    <div class="canvas-area">
      <div id="canvas">
        <div class="canvas-placeholder">
          <h3>빈 캔버스</h3>
          <p>왼쪽에서 "빈 상자 추가"를 클릭하거나<br>아래 예시를 불러오세요.</p>
        </div>
      </div>
    </div>
    
    <div class="tree-panel">
      <h3>🌲 트리 구조</h3>
      <pre id="tree-view">트리가 없습니다.</pre>
    </div>
  </div>
  
  <div class="status-bar">
    <span id="status-selected">선택: 없음</span>
    <span id="status-tree-info">노드 수: 0</span>
  </div>

  <script type="module">
    // ============================================================
    // tree.ts (M0-3 보강: SizeMode 추가)
    // ============================================================
    
    let idCounter = 0;
    
    function generateId() {
      const randomPart = Math.random().toString(36).substring(2, 8);
      const counterPart = (++idCounter).toString(36);
      return `el_${randomPart}${counterPart}`;
    }
    
    const defaultLayout = {
      direction: "vertical",
      align: "start",
      gap: 8,
      padding: 16,  // 빈 상자도 보이도록 기본 패딩 증가
    };
    
    function createContainer(name, layout = {}, size = {}) {
      return {
        id: generateId(),
        type: "container",
        name,
        layout: { ...defaultLayout, ...layout },
        children: [],
        width: size.width,
        height: size.height,
        background: "#f8f9fa",  // 빈 상자도 보이도록 기본 배경색
      };
    }
    
    function createText(name, content, size = {}) {
      return {
        id: generateId(),
        type: "text",
        name,
        content,
        width: size.width,
        height: size.height,
      };
    }
    
    function createInput(name, inputType, label, size = {}) {
      return {
        id: generateId(),
        type: "input",
        name,
        inputType,
        label,
        width: size.width,
        height: size.height,
      };
    }
    
    function addChild(parent, child) {
      if (parent.type !== "container") {
        throw new Error(`Cannot add child to '${parent.name}' (${parent.type})`);
      }
      parent.children.push(child);
    }
    
    function removeChild(parent, childId) {
      if (parent.type !== "container") return false;
      const index = parent.children.findIndex(c => c.id === childId);
      if (index === -1) return false;
      parent.children.splice(index, 1);
      return true;
    }
    
    function findById(root, id) {
      if (root.id === id) return root;
      if (root.type === "container") {
        for (const child of root.children) {
          const found = findById(child, id);
          if (found) return found;
        }
      }
      return null;
    }
    
    function findWithParent(root, targetId) {
      if (root.id === targetId) return { element: root, parent: null };
      if (root.type === "container") {
        for (const child of root.children) {
          if (child.id === targetId) return { element: child, parent: root };
          const found = findWithParent(child, targetId);
          if (found) return found;
        }
      }
      return null;
    }
    
    function moveChildUp(parent, childId) {
      const index = parent.children.findIndex(c => c.id === childId);
      if (index <= 0) return false;
      [parent.children[index - 1], parent.children[index]] = [parent.children[index], parent.children[index - 1]];
      return true;
    }
    
    function moveChildDown(parent, childId) {
      const index = parent.children.findIndex(c => c.id === childId);
      if (index === -1 || index >= parent.children.length - 1) return false;
      [parent.children[index], parent.children[index + 1]] = [parent.children[index + 1], parent.children[index]];
      return true;
    }
    
    function countNodes(root) {
      let count = 1;
      if (root.type === "container") {
        for (const child of root.children) count += countNodes(child);
      }
      return count;
    }
    
    function setWidth(element, width) { element.width = width; }
    function setHeight(element, height) { element.height = height; }
    
    // ============================================================
    // adapter.ts (M0-3 보강: SizeMode 렌더링)
    // ============================================================
    
    function sizeModeToCss(size, isMainAxis) {
      if (!size || size.mode === "내용맞춤") return {};
      switch (size.mode) {
        case "고정": return isMainAxis ? { flex: "0 0 auto" } : {};
        case "꽉채움": return { flex: "1 1 auto" };
        case "비율": return { flex: `0 0 ${size.percent}%` };
        default: return {};
      }
    }
    
    function getFixedSize(size) {
      return size?.mode === "고정" ? size.px : null;
    }
    
    class DomAdapter {
      constructor() {
        this.rootElement = null;
        this.container = null;
        this.currentTree = null;
        this.selectedId = null;
        this.changeCallback = null;
        this.selectCallback = null;
        this.elementMap = new Map();
      }
      
      onChange(cb) { this.changeCallback = cb; }
      onSelect(cb) { this.selectCallback = cb; }
      getSelectedId() { return this.selectedId; }
      
      select(id) {
        if (this.selectedId) {
          const prev = this.elementMap.get(this.selectedId);
          if (prev) {
            prev.style.outline = "";
            prev.style.outlineOffset = "";
          }
        }
        this.selectedId = id;
        if (id) {
          const el = this.elementMap.get(id);
          if (el) {
            el.style.outline = "3px solid #007bff";
            el.style.outlineOffset = "-2px";
          }
        }
        if (this.selectCallback) this.selectCallback(id);
      }
      
      render(tree, container = document.body) {
        this.currentTree = tree;
        this.container = container;
        this.elementMap.clear();
        container.innerHTML = "";
        this.rootElement = this.createElement(tree);
        container.appendChild(this.rootElement);
        if (this.selectedId) this.select(this.selectedId);
      }
      
      applySizeStyles(dom, element, isHorizontal) {
        // width 적용
        if (element.width) {
          Object.assign(dom.style, sizeModeToCss(element.width, isHorizontal));
          const fixedWidth = getFixedSize(element.width);
          if (fixedWidth !== null) dom.style.width = `${fixedWidth}px`;
          if (element.width.mode === "비율") dom.style.width = `${element.width.percent}%`;
        }
        // height 적용
        if (element.height) {
          Object.assign(dom.style, sizeModeToCss(element.height, !isHorizontal));
          const fixedHeight = getFixedSize(element.height);
          if (fixedHeight !== null) dom.style.height = `${fixedHeight}px`;
          if (element.height.mode === "비율") dom.style.height = `${element.height.percent}%`;
        }
      }
      
      createElement(element) {
        let dom;
        
        switch (element.type) {
          case "container": {
            const isHorizontal = element.layout.direction === "horizontal";
            dom = document.createElement("div");
            dom.style.display = "flex";
            dom.style.flexDirection = isHorizontal ? "row" : "column";
            const alignMap = { start: "flex-start", center: "center", end: "flex-end" };
            dom.style.alignItems = alignMap[element.layout.align];
            dom.style.justifyContent = alignMap[element.layout.align];
            dom.style.gap = `${element.layout.gap}px`;
            dom.style.padding = `${element.layout.padding}px`;
            if (element.background) dom.style.backgroundColor = element.background;
            dom.style.border = "1px solid #ddd";
            dom.style.minHeight = "20px";
            dom.style.minWidth = "20px";
            
            // 크기 적용
            this.applySizeStyles(dom, element, isHorizontal);
            
            for (const child of element.children) {
              dom.appendChild(this.createElement(child));
            }
            break;
          }
            
          case "text":
            dom = document.createElement("span");
            dom.textContent = element.content;
            if (element.fontSize) dom.style.fontSize = `${element.fontSize}px`;
            if (element.bold) dom.style.fontWeight = "bold";
            this.applySizeStyles(dom, element, false);
            break;
            
          case "input":
            if (element.inputType === "button") {
              dom = document.createElement("button");
              dom.textContent = element.label;
              dom.style.padding = "8px 16px";
              dom.style.cursor = "pointer";
            } else {
              dom = document.createElement("input");
              dom.type = "text";
              dom.placeholder = element.label;
              dom.style.padding = "8px";
              dom.style.border = "1px solid #ccc";
              dom.style.borderRadius = "4px";
            }
            this.applySizeStyles(dom, element, false);
            break;
        }
        
        this.elementMap.set(element.id, dom);
        dom.style.cursor = "pointer";
        dom.addEventListener("click", (e) => {
          e.stopPropagation();
          this.select(element.id);
        });
        
        return dom;
      }
    }
    
    // ============================================================
    // Editor
    // ============================================================
    
    class Editor {
      constructor() {
        this.tree = null;
        this.selectedId = null;
        this.adapter = new DomAdapter();
        this.canvas = document.getElementById("canvas");
        
        this.adapter.onSelect((id) => {
          this.selectedId = id;
          this.onSelectionChange();
        });
      }
      
      setTree(tree) {
        this.tree = tree;
        this.render();
      }
      
      render() {
        if (!this.tree) return;
        this.adapter.render(this.tree, this.canvas);
        this.updateTreeView();
        this.updateStatusBar();
      }
      
      getSelectedElement() {
        if (!this.tree || !this.selectedId) return null;
        return findById(this.tree, this.selectedId);
      }
      
      getSelectedParent() {
        if (!this.tree || !this.selectedId) return null;
        return findWithParent(this.tree, this.selectedId)?.parent;
      }
      
      getSelectedContainer() {
        const el = this.getSelectedElement();
        return el?.type === "container" ? el : null;
      }
      
      // --- 명령들 ---
      
      addContainer() {
        if (!this.tree) {
          this.tree = createContainer("루트");
          this.render();
          return true;
        }
        
        const newContainer = createContainer("새 상자");
        const target = this.getSelectedContainer();
        
        if (target) {
          addChild(target, newContainer);
        } else if (this.tree.type === "container") {
          addChild(this.tree, newContainer);
        }
        
        this.render();
        return true;
      }
      
      addText() {
        const target = this.getSelectedContainer();
        if (!target) return false;
        const text = createText("텍스트", "새 텍스트");
        addChild(target, text);
        this.render();
        return true;
      }
      
      addButton() {
        const target = this.getSelectedContainer();
        if (!target) return false;
        const btn = createInput("버튼", "button", "버튼");
        addChild(target, btn);
        this.render();
        return true;
      }
      
      addInputField() {
        const target = this.getSelectedContainer();
        if (!target) return false;
        const input = createInput("입력칸", "textfield", "입력하세요");
        addChild(target, input);
        this.render();
        return true;
      }
      
      deleteSelected() {
        if (!this.tree || !this.selectedId) return false;
        if (this.selectedId === this.tree.id) return false;
        
        const result = findWithParent(this.tree, this.selectedId);
        if (!result || !result.parent) return false;
        
        removeChild(result.parent, this.selectedId);
        this.selectedId = null;
        this.render();
        return true;
      }
      
      moveUp() {
        if (!this.tree || !this.selectedId) return false;
        const result = findWithParent(this.tree, this.selectedId);
        if (!result || !result.parent) return false;
        if (moveChildUp(result.parent, this.selectedId)) {
          this.render();
          return true;
        }
        return false;
      }
      
      moveDown() {
        if (!this.tree || !this.selectedId) return false;
        const result = findWithParent(this.tree, this.selectedId);
        if (!result || !result.parent) return false;
        if (moveChildDown(result.parent, this.selectedId)) {
          this.render();
          return true;
        }
        return false;
      }
      
      // --- 속성 업데이트 ---
      
      updateName(name) {
        const el = this.getSelectedElement();
        if (el) { el.name = name; this.render(); }
      }
      
      updateTextContent(content) {
        const el = this.getSelectedElement();
        if (el && el.type === "text") { el.content = content; this.render(); }
      }
      
      updateTextFontSize(size) {
        const el = this.getSelectedElement();
        if (el && el.type === "text") { el.fontSize = parseInt(size) || undefined; this.render(); }
      }
      
      updateInputLabel(label) {
        const el = this.getSelectedElement();
        if (el && el.type === "input") { el.label = label; this.render(); }
      }
      
      updateLayoutDirection(direction) {
        const el = this.getSelectedContainer();
        if (el) { el.layout.direction = direction; this.render(); }
      }
      
      updateLayoutAlign(align) {
        const el = this.getSelectedContainer();
        if (el) { el.layout.align = align; this.render(); }
      }
      
      updateLayoutGap(gap) {
        const el = this.getSelectedContainer();
        if (el) { el.layout.gap = parseInt(gap) || 0; this.render(); }
      }
      
      updateLayoutPadding(padding) {
        const el = this.getSelectedContainer();
        if (el) { el.layout.padding = parseInt(padding) || 0; this.render(); }
      }
      
      updateContainerBg(color) {
        const el = this.getSelectedContainer();
        if (el) { el.background = color; this.render(); }
      }
      
      // --- 크기 설정 (M0-3 보강) ---
      
      setWidth(sizeMode, value) {
        const el = this.getSelectedElement();
        if (!el) return false;
        
        if (sizeMode === "내용맞춤") {
          setWidth(el, { mode: "내용맞춤" });
        } else if (sizeMode === "고정") {
          setWidth(el, { mode: "고정", px: parseInt(value) || 100 });
        } else if (sizeMode === "꽉채움") {
          setWidth(el, { mode: "꽉채움" });
        } else if (sizeMode === "비율") {
          setWidth(el, { mode: "비율", percent: parseInt(value) || 50 });
        }
        this.render();
        return true;
      }
      
      setHeight(sizeMode, value) {
        const el = this.getSelectedElement();
        if (!el) return false;
        
        if (sizeMode === "내용맞춤") {
          setHeight(el, { mode: "내용맞춤" });
        } else if (sizeMode === "고정") {
          setHeight(el, { mode: "고정", px: parseInt(value) || 100 });
        } else if (sizeMode === "꽉채움") {
          setHeight(el, { mode: "꽉채움" });
        } else if (sizeMode === "비율") {
          setHeight(el, { mode: "비율", percent: parseInt(value) || 50 });
        }
        this.render();
        return true;
      }
      
      // --- UI 업데이트 ---
      
      onSelectionChange() {
        const el = this.getSelectedElement();
        const container = this.getSelectedContainer();
        const parent = this.getSelectedParent();
        
        // 버튼 활성화
        const hasContainerSelected = !!container;
        const hasSelection = !!el;
        const canMove = !!parent && parent.children.length > 1;
        const isRoot = el?.id === this.tree?.id;
        
        document.querySelectorAll("#add-elements-buttons button").forEach(btn => {
          btn.disabled = !hasContainerSelected;
        });
        
        document.getElementById("btn-move-up").disabled = !canMove;
        document.getElementById("btn-move-down").disabled = !canMove;
        document.getElementById("btn-delete").disabled = !hasSelection || isRoot;
        
        // 패널 표시/숨김
        document.getElementById("size-panel").style.display = hasSelection ? "block" : "none";
        this.updatePropertiesPanel(el);
        this.updateSizePanel(el);
        
        // 상태 표시
        document.getElementById("status-selected").textContent = el 
          ? `선택: ${el.name} (${el.type})` 
          : "선택: 없음";
      }
      
      updatePropertiesPanel(el) {
        const panel = document.getElementById("properties-panel");
        if (!el) { panel.style.display = "none"; return; }
        
        panel.style.display = "block";
        document.getElementById("prop-name").value = el.name;
        
        document.getElementById("text-properties").style.display = el.type === "text" ? "block" : "none";
        document.getElementById("input-properties").style.display = el.type === "input" ? "block" : "none";
        document.getElementById("container-properties").style.display = el.type === "container" ? "block" : "none";
        
        if (el.type === "text") {
          document.getElementById("prop-text-content").value = el.content;
          document.getElementById("prop-text-size").value = el.fontSize || "";
        } else if (el.type === "input") {
          document.getElementById("prop-input-label").value = el.label;
        } else if (el.type === "container") {
          document.getElementById("prop-layout-direction").value = el.layout.direction;
          document.getElementById("prop-layout-align").value = el.layout.align;
          document.getElementById("prop-layout-gap").value = el.layout.gap;
          document.getElementById("prop-layout-padding").value = el.layout.padding;
          document.getElementById("prop-container-bg").value = el.background || "#ffffff";
        }
      }
      
      updateSizePanel(el) {
        if (!el) return;
        
        // width
        const widthMode = el.width?.mode || "내용맞춤";
        document.getElementById("width-mode").value = widthMode;
        document.getElementById("width-value-group").style.display = 
          (widthMode === "고정" || widthMode === "비율") ? "block" : "none";
        if (widthMode === "고정") {
          document.getElementById("width-value").value = el.width.px;
        } else if (widthMode === "비율") {
          document.getElementById("width-value").value = el.width.percent;
        }
        
        // height
        const heightMode = el.height?.mode || "내용맞춤";
        document.getElementById("height-mode").value = heightMode;
        document.getElementById("height-value-group").style.display = 
          (heightMode === "고정" || heightMode === "비율") ? "block" : "none";
        if (heightMode === "고정") {
          document.getElementById("height-value").value = el.height.px;
        } else if (heightMode === "비율") {
          document.getElementById("height-value").value = el.height.percent;
        }
      }
      
      updateTreeView() {
        const view = document.getElementById("tree-view");
        if (!this.tree) { view.textContent = "트리가 없습니다."; return; }
        
        const simplify = (el) => {
          const result = { type: el.type, name: el.name };
          if (el.width) result.width = el.width;
          if (el.height) result.height = el.height;
          if (el.type === "container") {
            result.layout = el.layout;
            if (el.background) result.background = el.background;
            result.children = el.children.map(simplify);
          } else if (el.type === "text") {
            result.content = el.content;
            if (el.fontSize) result.fontSize = el.fontSize;
            if (el.bold) result.bold = el.bold;
          } else if (el.type === "input") {
            result.inputType = el.inputType;
            result.label = el.label;
          }
          return result;
        };
        
        view.textContent = JSON.stringify(simplify(this.tree), null, 2);
      }
      
      updateStatusBar() {
        const count = this.tree ? countNodes(this.tree) : 0;
        document.getElementById("status-tree-info").textContent = `노드 수: ${count}`;
      }
    }
    
    // ============================================================
    // 글로벌 함수들
    // ============================================================
    
    const editor = new Editor();
    
    window.addContainer = () => editor.addContainer();
    window.addText = () => editor.addText();
    window.addButton = () => editor.addButton();
    window.addInputField = () => editor.addInputField();
    window.deleteSelected = () => editor.deleteSelected();
    window.moveUp = () => editor.moveUp();
    window.moveDown = () => editor.moveDown();
    
    window.updateName = (v) => editor.updateName(v);
    window.updateTextContent = (v) => editor.updateTextContent(v);
    window.updateTextFontSize = (v) => editor.updateTextFontSize(v);
    window.updateInputLabel = (v) => editor.updateInputLabel(v);
    window.updateLayoutDirection = (v) => editor.updateLayoutDirection(v);
    window.updateLayoutAlign = (v) => editor.updateLayoutAlign(v);
    window.updateLayoutGap = (v) => editor.updateLayoutGap(v);
    window.updateLayoutPadding = (v) => editor.updateLayoutPadding(v);
    window.updateContainerBg = (v) => editor.updateContainerBg(v);
    
    // 크기 설정 UI 핸들러
    window.onWidthModeChange = () => {
      const mode = document.getElementById("width-mode").value;
      const valueGroup = document.getElementById("width-value-group");
      const needsValue = (mode === "고정" || mode === "비율");
      
      valueGroup.style.display = needsValue ? "block" : "none";
      
      // 값이 필요 없는 경우(내용맞춤, 꽉채움)는 바로 적용
      if (!needsValue) {
        editor.setWidth(mode, null);
      } else {
        // 기본값 설정
        document.getElementById("width-value").value = mode === "고정" ? 200 : 50;
        editor.setWidth(mode, document.getElementById("width-value").value);
      }
    };
    
    window.onHeightModeChange = () => {
      const mode = document.getElementById("height-mode").value;
      const valueGroup = document.getElementById("height-value-group");
      const needsValue = (mode === "고정" || mode === "비율");
      
      valueGroup.style.display = needsValue ? "block" : "none";
      
      // 값이 필요 없는 경우(내용맞춤, 꽉채움)는 바로 적용
      if (!needsValue) {
        editor.setHeight(mode, null);
      } else {
        // 기본값 설정
        document.getElementById("height-value").value = mode === "고정" ? 100 : 50;
        editor.setHeight(mode, document.getElementById("height-value").value);
      }
    };
    
    window.updateWidth = () => {
      const mode = document.getElementById("width-mode").value;
      const value = document.getElementById("width-value").value;
      editor.setWidth(mode, value);
    };
    
    window.updateHeight = () => {
      const mode = document.getElementById("height-mode").value;
      const value = document.getElementById("height-value").value;
      editor.setHeight(mode, value);
    };
    
    window.resetToEmpty = () => {
      editor.setTree(null);
      document.getElementById("canvas").innerHTML = `
        <div class="canvas-placeholder">
          <h3>빈 캔버스</h3>
          <p>왼쪽에서 "빈 상자 추가"를 클릭하거나<br>아래 예시를 불러오세요.</p>
        </div>
      `;
    };
    
    // 예시: 사이드바 30:70 분할
    window.loadSidebarExample = () => {
      const root = createContainer("전체 레이아웃", { direction: "horizontal" });
      
      const sidebar = createContainer("사이드바", { direction: "vertical" }, { width: { mode: "비율", percent: 30 } });
      sidebar.background = "#e3f2fd";
      const sidebarTitle = createText("메뉴", "사이드바");
      sidebarTitle.fontSize = 18;
      sidebarTitle.bold = true;
      addChild(sidebar, sidebarTitle);
      
      const content = createContainer("콘텐츠", { direction: "vertical" }, { width: { mode: "꽉채움" } });
      content.background = "#f5f5f5";
      const contentTitle = createText("제목", "본문 내용");
      contentTitle.fontSize = 20;
      contentTitle.bold = true;
      addChild(content, contentTitle);
      
      addChild(root, sidebar);
      addChild(root, content);
      
      editor.setTree(root);
    };
    
    // 예시: 헤더+본문+푸터
    window.loadHeaderExample = () => {
      const root = createContainer("페이지", { direction: "vertical" });
      
      const header = createContainer("헤더", { direction: "horizontal", align: "center" }, { height: { mode: "고정", px: 64 } });
      header.background = "#333";
      const logo = createText("로고", "MyApp", { width: { mode: "내용맞춤" } });
      logo.fontSize = 20;
      logo.bold = true;
      Object.assign(logo, { fontSize: 20, bold: true }); // 스타일 적용용
      header.background = "#2196f3";
      addChild(header, logo);
      
      const main = createContainer("본문", { direction: "vertical" }, { height: { mode: "꽉채움" } });
      main.background = "#fafafa";
      const mainText = createText("본문", "여기에 내용이 들어갑니다.");
      addChild(main, mainText);
      
      const footer = createContainer("푸터", { direction: "horizontal", align: "center" }, { height: { mode: "고정", px: 40 } });
      footer.background = "#eee";
      const footerText = createText("카피라이트", "© 2024");
      addChild(footer, footerText);
      
      addChild(root, header);
      addChild(root, main);
      addChild(root, footer);
      
      editor.setTree(root);
    };
    
    // 예시: 로그인
    window.loadLoginExample = () => {
      const root = createContainer("로그인 화면", { direction: "vertical", align: "center", gap: 20, padding: 40 });
      
      const title = createText("제목", "로그인");
      title.fontSize = 24;
      title.bold = true;
      
      const email = createInput("이메일", "textfield", "이메일을 입력하세요");
      const password = createInput("비밀번호", "textfield", "비밀번호를 입력하세요");
      const btn = createInput("로그인버튼", "button", "로그인");
      
      addChild(root, title);
      addChild(root, email);
      addChild(root, password);
      addChild(root, btn);
      
      editor.setTree(root);
    };
    
    // 초기화
    window.resetToEmpty();
  </script>
</body>
</html>
