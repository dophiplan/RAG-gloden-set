<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M0 완성: 디자인 = 코드</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: #16213e;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e94560;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .header .tagline {
      color: #e94560;
      font-size: 14px;
      font-weight: bold;
    }
    
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    /* 왼쪽: 편집 도구 + 캔버스 */
    .left-panel {
      width: 55%;
      display: flex;
      flex-direction: column;
      background: #0f0f23;
    }
    
    .toolbar {
      background: #16213e;
      padding: 12px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .toolbar h3 {
      margin: 0 12px 0 0;
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
    }
    
    .toolbar-group {
      display: flex;
      gap: 6px;
      align-items: center;
      padding-right: 12px;
      border-right: 1px solid #333;
      margin-right: 4px;
    }
    
    .toolbar-group:last-child {
      border-right: none;
    }
    
    button {
      padding: 6px 12px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    
    button:hover:not(:disabled) {
      background: #2a2a4e;
      border-color: #e94560;
    }
    
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    
    button.primary {
      background: #e94560;
      border-color: #e94560;
    }
    
    button.primary:hover:not(:disabled) {
      background: #ff6b6b;
    }
    
    button.secondary {
      background: #0f3460;
      border-color: #0f3460;
    }
    
    button.secondary:hover:not(:disabled) {
      background: #1a4a7a;
    }
    
    .canvas-area {
      flex: 1;
      padding: 20px;
      overflow: auto;
      background: #0a0a1a;
    }
    
    #canvas {
      background: #fff;
      border-radius: 8px;
      min-height: 400px;
      padding: 20px;
      color: #333;
    }
    
    .canvas-placeholder {
      color: #666;
      text-align: center;
      padding: 80px 20px;
    }
    
    /* 오른쪽: JSON 패널 */
    .right-panel {
      width: 45%;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      border-left: 2px solid #333;
    }
    
    .json-header {
      background: #16213e;
      padding: 12px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .json-header h3 {
      margin: 0;
      font-size: 14px;
      color: #4ecca3;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .json-header .status {
      font-size: 11px;
      color: #888;
    }
    
    .json-actions {
      display: flex;
      gap: 8px;
    }
    
    #json-viewer {
      flex: 1;
      padding: 16px;
      overflow: auto;
      font-family: "Monaco", "Menlo", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.6;
      background: #0f0f1a;
      color: #d4d4d4;
      white-space: pre;
    }
    
    /* JSON 구문 강조 */
    .json-key { color: #9cdcfe; }
    .json-string { color: #ce9178; }
    .json-number { color: #b5cea8; }
    .json-boolean { color: #569cd6; }
    .json-null { color: #569cd6; }
    .json-bracket { color: #ffd700; }
    
    /* 크기 조절 패널 */
    .size-panel {
      background: #16213e;
      padding: 12px 16px;
      border-top: 1px solid #333;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    
    .size-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .size-control label {
      font-size: 12px;
      color: #888;
    }
    
    .size-control select,
    .size-control input {
      padding: 4px 8px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1a1a2e;
      color: #fff;
      font-size: 12px;
    }
    
    .size-control select {
      width: 100px;
    }
    
    .size-control input {
      width: 60px;
    }
    
    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #4ecca3;
      color: #1a1a2e;
      padding: 12px 20px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      z-index: 1000;
    }
    
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* 선택된 요소 정보 */
    .selection-info {
      background: #16213e;
      padding: 8px 16px;
      border-top: 1px solid #333;
      font-size: 12px;
      color: #888;
    }
    
    .selection-info span {
      color: #e94560;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      🎨 M0 완성
      <span class="tagline">"디자인을 만지면 곧 코드가 된다"</span>
    </h1>
    <div style="font-size: 12px; color: #888;">트리 ↔ 화면 ↔ JSON</div>
  </div>
  
  <div class="main">
    <!-- 왼쪽: 편집 도구 + 캔버스 -->
    <div class="left-panel">
      <div class="toolbar">
        <div class="toolbar-group">
          <h3>프레임</h3>
          <button class="primary" onclick="addContainer()">+ 상자</button>
        </div>
        
        <div class="toolbar-group">
          <h3>요소</h3>
          <button onclick="addText()" id="btn-add-text" disabled>+ 텍스트</button>
          <button onclick="addButton()" id="btn-add-btn" disabled>+ 버튼</button>
        </div>
        
        <div class="toolbar-group">
          <h3>순서</h3>
          <button onclick="moveUp()" id="btn-move-up" disabled>↑</button>
          <button onclick="moveDown()" id="btn-move-down" disabled>↓</button>
        </div>
        
        <div class="toolbar-group">
          <h3>예시</h3>
          <button class="secondary" onclick="loadSidebarExample()">사이드바</button>
          <button class="secondary" onclick="loadHeaderExample()">헤더레이아웃</button>
          <button onclick="resetToEmpty()">초기화</button>
        </div>
        
        <div class="toolbar-group">
          <button class="danger" onclick="deleteSelected()" id="btn-delete" disabled>🗑️ 삭제</button>
        </div>
      </div>
      
      <div class="canvas-area">
        <div id="canvas">
          <div class="canvas-placeholder">
            <h3>✨ 빈 캔버스</h3>
            <p>"+ 상자"를 클릭하여 프레임을 만들고,<br>JSON이 실시간으로 변하는 것을 확인하세요.</p>
          </div>
        </div>
      </div>
      
      <div class="selection-info">
        선택: <span id="selection-name">없음</span> | 
        타입: <span id="selection-type">-</span> | 
        ID: <span id="selection-id">-</span>
      </div>
    </div>
    
    <!-- 오른쪽: JSON 패널 -->
    <div class="right-panel">
      <div class="json-header">
        <h3>📄 JSON (Live)</h3>
        <div class="json-actions">
          <span class="status" id="json-status">유효한 JSON ✓</span>
          <button class="secondary" onclick="copyJSON()">📋 복사</button>
        </div>
      </div>
      
      <div id="json-viewer">// 여기에 JSON이 표시됩니다</div>
      
      <div class="size-panel" id="size-controls" style="display: none;">
        <div class="size-control">
          <label>가로</label>
          <select id="width-mode" onchange="onWidthModeChange()">
            <option value="내용맞춤">내용맞춤</option>
            <option value="고정">고정(px)</option>
            <option value="꽉채움">꽉채움</option>
            <option value="비율">비율(%)</option>
          </select>
          <input type="number" id="width-value" onchange="updateWidth()" placeholder="값" style="display: none;">
        </div>
        
        <div class="size-control">
          <label>세로</label>
          <select id="height-mode" onchange="onHeightModeChange()">
            <option value="내용맞춤">내용맞춤</option>
            <option value="고정">고정(px)</option>
            <option value="꽉채움">꽉채움</option>
            <option value="비율">비율(%)</option>
          </select>
          <input type="number" id="height-value" onchange="updateHeight()" placeholder="값" style="display: none;">
        </div>
      </div>
    </div>
  </div>
  
  <!-- 토스트 알림 -->
  <div class="toast" id="toast"></div>

  <script type="module">
    // ============================================================
    // tree.ts (M0-1 + M0-3 보강)
    // ============================================================
    
    let idCounter = 0;
    
    function generateId() {
      const randomPart = Math.random().toString(36).substring(2, 8);
      const counterPart = (++idCounter).toString(36);
      return `el_${randomPart}${counterPart}`;
    }
    
    const defaultLayout = {
      direction: "vertical",
      align: "start",
      gap: 8,
      padding: 16,
    };
    
    function createContainer(name, layout = {}, size = {}) {
      return {
        id: generateId(),
        type: "container",
        name,
        layout: { ...defaultLayout, ...layout },
        children: [],
        width: size.width,
        height: size.height,
        background: "#f8f9fa",
      };
    }
    
    function createText(name, content, size = {}) {
      return {
        id: generateId(),
        type: "text",
        name,
        content,
        width: size.width,
        height: size.height,
      };
    }
    
    function createInput(name, inputType, label, size = {}) {
      return {
        id: generateId(),
        type: "input",
        name,
        inputType,
        label,
        width: size.width,
        height: size.height,
      };
    }
    
    function addChild(parent, child) {
      if (parent.type !== "container") {
        throw new Error(`Cannot add child to '${parent.name}' (${parent.type})`);
      }
      parent.children.push(child);
    }
    
    function removeChild(parent, childId) {
      if (parent.type !== "container") return false;
      const index = parent.children.findIndex(c => c.id === childId);
      if (index === -1) return false;
      parent.children.splice(index, 1);
      return true;
    }
    
    function findById(root, id) {
      if (root.id === id) return root;
      if (root.type === "container") {
        for (const child of root.children) {
          const found = findById(child, id);
          if (found) return found;
        }
      }
      return null;
    }
    
    function findWithParent(root, targetId) {
      if (root.id === targetId) return { element: root, parent: null };
      if (root.type === "container") {
        for (const child of root.children) {
          if (child.id === targetId) return { element: child, parent: root };
          const found = findWithParent(child, targetId);
          if (found) return found;
        }
      }
      return null;
    }
    
    function moveChildUp(parent, childId) {
      const index = parent.children.findIndex(c => c.id === childId);
      if (index <= 0) return false;
      [parent.children[index - 1], parent.children[index]] = [parent.children[index], parent.children[index - 1]];
      return true;
    }
    
    function moveChildDown(parent, childId) {
      const index = parent.children.findIndex(c => c.id === childId);
      if (index === -1 || index >= parent.children.length - 1) return false;
      [parent.children[index], parent.children[index + 1]] = [parent.children[index + 1], parent.children[index]];
      return true;
    }
    
    function setWidth(element, width) { element.width = width; }
    function setHeight(element, height) { element.height = height; }
    
    // ============================================================
    // adapter.ts (M0-2 + M0-3)
    // ============================================================
    
    function sizeModeToCss(size, isMainAxis) {
      if (!size || size.mode === "내용맞춤") return {};
      switch (size.mode) {
        case "고정": return isMainAxis ? { flex: "0 0 auto" } : {};
        case "꽉채움": return { flex: "1 1 auto" };
        case "비율": return { flex: `0 0 ${size.percent}%` };
        default: return {};
      }
    }
    
    function getFixedSize(size) {
      return size?.mode === "고정" ? size.px : null;
    }
    
    class DomAdapter {
      constructor() {
        this.rootElement = null;
        this.container = null;
        this.curre[기밀마스킹]ree = null;
        this.selectedId = null;
        this.selectCallback = null;
        this.elementMap = new Map();
      }
      
      onSelect(cb) { this.selectCallback = cb; }
      getSelectedId() { return this.selectedId; }
      
      select(id) {
        if (this.selectedId) {
          const prev = this.elementMap.get(this.selectedId);
          if (prev) {
            prev.style.outline = "";
            prev.style.outlineOffset = "";
          }
        }
        this.selectedId = id;
        if (id) {
          const el = this.elementMap.get(id);
          if (el) {
            el.style.outline = "3px solid #e94560";
            el.style.outlineOffset = "-2px";
          }
        }
        if (this.selectCallback) this.selectCallback(id);
      }
      
      render(tree, container = document.body) {
        this.curre[기밀마스킹]ree = tree;
        this.container = container;
        this.elementMap.clear();
        container.innerHTML = "";
        this.rootElement = this.createElement(tree);
        container.appendChild(this.rootElement);
        if (this.selectedId) this.select(this.selectedId);
      }
      
      applySizeStyles(dom, element, isHorizontal) {
        if (element.width) {
          Object.assign(dom.style, sizeModeToCss(element.width, isHorizontal));
          const fixedWidth = getFixedSize(element.width);
          if (fixedWidth !== null) dom.style.width = `${fixedWidth}px`;
          if (element.width.mode === "비율") dom.style.width = `${element.width.percent}%`;
        }
        if (element.height) {
          Object.assign(dom.style, sizeModeToCss(element.height, !isHorizontal));
          const fixedHeight = getFixedSize(element.height);
          if (fixedHeight !== null) dom.style.height = `${fixedHeight}px`;
          if (element.height.mode === "비율") dom.style.height = `${element.height.percent}%`;
        }
      }
      
      createElement(element) {
        let dom;
        
        switch (element.type) {
          case "container": {
            const isHorizontal = element.layout.direction === "horizontal";
            dom = document.createElement("div");
            dom.style.display = "flex";
            dom.style.flexDirection = isHorizontal ? "row" : "column";
            const alignMap = { start: "flex-start", center: "center", end: "flex-end" };
            dom.style.alignItems = alignMap[element.layout.align];
            dom.style.justifyContent = alignMap[element.layout.align];
            dom.style.gap = `${element.layout.gap}px`;
            dom.style.padding = `${element.layout.padding}px`;
            if (element.background) dom.style.backgroundColor = element.background;
            dom.style.border = "1px solid #ddd";
            dom.style.minHeight = "20px";
            dom.style.minWidth = "20px";
            this.applySizeStyles(dom, element, isHorizontal);
            for (const child of element.children) {
              dom.appendChild(this.createElement(child));
            }
            break;
          }
            
          case "text":
            dom = document.createElement("span");
            dom.textContent = element.content;
            if (element.fontSize) dom.style.fontSize = `${element.fontSize}px`;
            if (element.bold) dom.style.fontWeight = "bold";
            this.applySizeStyles(dom, element, false);
            break;
            
          case "input":
            if (element.inputType === "button") {
              dom = document.createElement("button");
              dom.textContent = element.label;
              dom.style.padding = "8px 16px";
              dom.style.cursor = "pointer";
            } else {
              dom = document.createElement("input");
              dom.type = "text";
              dom.placeholder = element.label;
              dom.style.padding = "8px";
              dom.style.border = "1px solid #ccc";
              dom.style.borderRadius = "4px";
            }
            this.applySizeStyles(dom, element, false);
            break;
        }
        
        this.elementMap.set(element.id, dom);
        dom.style.cursor = "pointer";
        dom.addEventListener("click", (e) => {
          e.stopPropagation();
          this.select(element.id);
        });
        
        return dom;
      }
    }
    
    // ============================================================
    // M0-4: JSON Viewer with syntax highlighting
    // ============================================================
    
    function highlightJSON(json) {
      if (!json) return '';
      
      return json
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/(".*?"):/g, '<span class="json-key">$1</span>:')
        .replace(/: "(.*?)"/g, ': <span class="json-string">"$1"</span>')
        .replace(/: (\d+)/g, ': <span class="json-number">$1</span>')
        .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
        .replace(/: null/g, ': <span class="json-null">null</span>')
        .replace(/([{}\[\]])/g, '<span class="json-bracket">$1</span>');
    }
    
    function updateJSONViewer(tree) {
      const viewer = document.getElementById("json-viewer");
      if (!tree) {
        viewer.innerHTML = "// 여기에 JSON이 표시됩니다";
        return;
      }
      
      // 트리를 순수 데이터로 변환 (순환 참조 제거)
      const cleanTree = JSON.parse(JSON.stringify(tree));
      const jsonStr = JSON.stringify(cleanTree, null, 2);
      
      // 구문 강조 적용
      viewer.innerHTML = highlightJSON(jsonStr);
      
      // 유효성 검사 표시
      document.getElementById("json-status").textContent = "유효한 JSON ✓";
    }
    
    function copyJSON() {
      const tree = editor.getTree();
      if (!tree) {
        showToast("복사할 JSON이 없습니다");
        return;
      }
      
      const jsonStr = JSON.stringify(tree, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        showToast("JSON이 클립보드에 복사되었습니다!");
      }).catch(() => {
        showToast("복사 실패");
      });
    }
    
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }
    
    // ============================================================
    // Editor (통합)
    // ============================================================
    
    class Editor {
      constructor() {
        this.tree = null;
        this.selectedId = null;
        this.adapter = new DomAdapter();
        this.canvas = document.getElementById("canvas");
        
        this.adapter.onSelect((id) => {
          this.selectedId = id;
          this.onSelectionChange();
        });
      }
      
      setTree(tree) {
        this.tree = tree;
        this.render();
      }
      
      getTree() {
        return this.tree;
      }
      
      render() {
        if (!this.tree) {
          this.canvas.innerHTML = `
            <div class="canvas-placeholder">
              <h3>✨ 빈 캔버스</h3>
              <p>"+ 상자"를 클릭하여 프레임을 만들고,<br>JSON이 실시간으로 변하는 것을 확인하세요.</p>
            </div>
          `;
          updateJSONViewer(null);
          return;
        }
        
        this.adapter.render(this.tree, this.canvas);
        updateJSONViewer(this.tree); // M0-4: JSON 업데이트
        this.updateUI();
      }
      
      getSelectedElement() {
        if (!this.tree || !this.selectedId) return null;
        return findById(this.tree, this.selectedId);
      }
      
      getSelectedParent() {
        if (!this.tree || !this.selectedId) return null;
        return findWithParent(this.tree, this.selectedId)?.parent;
      }
      
      getSelectedContainer() {
        const el = this.getSelectedElement();
        return el?.type === "container" ? el : null;
      }
      
      // --- 명령들 ---
      
      addContainer() {
        if (!this.tree) {
          this.tree = createContainer("루트");
          this.render();
          return true;
        }
        
        const newContainer = createContainer("새 상자");
        const target = this.getSelectedContainer();
        
        if (target) {
          addChild(target, newContainer);
        } else if (this.tree.type === "container") {
          addChild(this.tree, newContainer);
        }
        
        this.render();
        return true;
      }
      
      addText() {
        const target = this.getSelectedContainer();
        if (!target) return false;
        const text = createText("텍스트", "새 텍스트");
        addChild(target, text);
        this.render();
        return true;
      }
      
      addButton() {
        const target = this.getSelectedContainer();
        if (!target) return false;
        const btn = createInput("버튼", "button", "버튼");
        addChild(target, btn);
        this.render();
        return true;
      }
      
      deleteSelected() {
        if (!this.tree || !this.selectedId) return false;
        if (this.selectedId === this.tree.id) return false;
        
        const result = findWithParent(this.tree, this.selectedId);
        if (!result || !result.parent) return false;
        
        removeChild(result.parent, this.selectedId);
        this.selectedId = null;
        this.render();
        return true;
      }
      
      moveUp() {
        if (!this.tree || !this.selectedId) return false;
        const result = findWithParent(this.tree, this.selectedId);
        if (!result || !result.parent) return false;
        if (moveChildUp(result.parent, this.selectedId)) {
          this.render();
          return true;
        }
        return false;
      }
      
      moveDown() {
        if (!this.tree || !this.selectedId) return false;
        const result = findWithParent(this.tree, this.selectedId);
        if (!result || !result.parent) return false;
        if (moveChildDown(result.parent, this.selectedId)) {
          this.render();
          return true;
        }
        return false;
      }
      
      // --- 크기 설정 ---
      
      setWidth(sizeMode, value) {
        const el = this.getSelectedElement();
        if (!el) return false;
        
        if (sizeMode === "내용맞춤") {
          setWidth(el, { mode: "내용맞춤" });
        } else if (sizeMode === "고정") {
          setWidth(el, { mode: "고정", px: parseInt(value) || 100 });
        } else if (sizeMode === "꽉채움") {
          setWidth(el, { mode: "꽉채움" });
        } else if (sizeMode === "비율") {
          setWidth(el, { mode: "비율", percent: parseInt(value) || 50 });
        }
        this.render();
        return true;
      }
      
      setHeight(sizeMode, value) {
        const el = this.getSelectedElement();
        if (!el) return false;
        
        if (sizeMode === "내용맞춤") {
          setHeight(el, { mode: "내용맞춤" });
        } else if (sizeMode === "고정") {
          setHeight(el, { mode: "고정", px: parseInt(value) || 100 });
        } else if (sizeMode === "꽉채움") {
          setHeight(el, { mode: "꽉채움" });
        } else if (sizeMode === "비율") {
          setHeight(el, { mode: "비율", percent: parseInt(value) || 50 });
        }
        this.render();
        return true;
      }
      
      // --- UI 업데이트 ---
      
      onSelectionChange() {
        const el = this.getSelectedElement();
        const container = this.getSelectedContainer();
        const parent = this.getSelectedParent();
        
        // 버튼 활성화
        const hasContainerSelected = !!container;
        const hasSelection = !!el;
        const canMove = !!parent && parent.children.length > 1;
        const isRoot = el?.id === this.tree?.id;
        
        document.getElementById("btn-add-text").disabled = !hasContainerSelected;
        document.getElementById("btn-add-btn").disabled = !hasContainerSelected;
        document.getElementById("btn-move-up").disabled = !canMove;
        document.getElementById("btn-move-down").disabled = !canMove;
        document.getElementById("btn-delete").disabled = !hasSelection || isRoot;
        
        // 선택 정보 표시
        if (el) {
          document.getElementById("selection-name").textContent = el.name;
          document.getElementById("selection-type").textContent = el.type;
          document.getElementById("selection-id").textContent = el.id.substring(0, 10) + "...";
        } else {
          document.getElementById("selection-name").textContent = "없음";
          document.getElementById("selection-type").textContent = "-";
          document.getElementById("selection-id").textContent = "-";
        }
        
        // 크기 조절 패널
        this.updateSizePanel(el);
      }
      
      updateSizePanel(el) {
        const panel = document.getElementById("size-controls");
        if (!el) {
          panel.style.display = "none";
          return;
        }
        
        panel.style.display = "flex";
        
        // width
        const widthMode = el.width?.mode || "내용맞춤";
        document.getElementById("width-mode").value = widthMode;
        document.getElementById("width-value").style.display = 
          (widthMode === "고정" || widthMode === "비율") ? "inline-block" : "none";
        if (widthMode === "고정") {
          document.getElementById("width-value").value = el.width.px;
        } else if (widthMode === "비율") {
          document.getElementById("width-value").value = el.width.percent;
        }
        
        // height
        const heightMode = el.height?.mode || "내용맞춤";
        document.getElementById("height-mode").value = heightMode;
        document.getElementById("height-value").style.display = 
          (heightMode === "고정" || heightMode === "비율") ? "inline-block" : "none";
        if (heightMode === "고정") {
          document.getElementById("height-value").value = el.height.px;
        } else if (heightMode === "비율") {
          document.getElementById("height-value").value = el.height.percent;
        }
      }
      
      updateUI() {
        this.onSelectionChange();
      }
    }
    
    // ============================================================
    // 글로벌 함수들
    // ============================================================
    
    const editor = new Editor();
    
    window.addContainer = () => editor.addContainer();
    window.addText = () => editor.addText();
    window.addButton = () => editor.addButton();
    window.deleteSelected = () => editor.deleteSelected();
    window.moveUp = () => editor.moveUp();
    window.moveDown = () => editor.moveDown();
    window.copyJSON = () => copyJSON();
    
    // 크기 설정 UI
    window.onWidthModeChange = () => {
      const mode = document.getElementById("width-mode").value;
      const needsValue = (mode === "고정" || mode === "비율");
      document.getElementById("width-value").style.display = needsValue ? "inline-block" : "none";
      
      if (!needsValue) {
        editor.setWidth(mode, null);
      } else {
        document.getElementById("width-value").value = mode === "고정" ? 200 : 50;
        editor.setWidth(mode, document.getElementById("width-value").value);
      }
    };
    
    window.onHeightModeChange = () => {
      const mode = document.getElementById("height-mode").value;
      const needsValue = (mode === "고정" || mode === "비율");
      document.getElementById("height-value").style.display = needsValue ? "inline-block" : "none";
      
      if (!needsValue) {
        editor.setHeight(mode, null);
      } else {
        document.getElementById("height-value").value = mode === "고정" ? 100 : 50;
        editor.setHeight(mode, document.getElementById("height-value").value);
      }
    };
    
    window.updateWidth = () => {
      const mode = document.getElementById("width-mode").value;
      const value = document.getElementById("width-value").value;
      editor.setWidth(mode, value);
    };
    
    window.updateHeight = () => {
      const mode = document.getElementById("height-mode").value;
      const value = document.getElementById("height-value").value;
      editor.setHeight(mode, value);
    };
    
    window.resetToEmpty = () => {
      editor.setTree(null);
    };
    
    // 예시: 사이드바 30:70
    window.loadSidebarExample = () => {
      const root = createContainer("전체 레이아웃", { direction: "horizontal" });
      
      const sidebar = createContainer("사이드바", { direction: "vertical" }, { width: { mode: "비율", percent: 30 } });
      sidebar.background = "#e3f2fd";
      const sidebarTitle = createText("메뉴", "사이드바");
      sidebarTitle.fontSize = 18;
      sidebarTitle.bold = true;
      addChild(sidebar, sidebarTitle);
      
      const content = createContainer("콘텐츠", { direction: "vertical" }, { width: { mode: "꽉채움" } });
      content.background = "#f5f5f5";
      const conte[기밀마스킹]itle = createText("제목", "본문 내용");
      conte[기밀마스킹]itle.fontSize = 20;
      conte[기밀마스킹]itle.bold = true;
      addChild(content, conte[기밀마스킹]itle);
      
      addChild(root, sidebar);
      addChild(root, content);
      
      editor.setTree(root);
    };
    
    // 예시: 헤더+본문+푸터
    window.loadHeaderExample = () => {
      const root = createContainer("페이지", { direction: "vertical" });
      
      const header = createContainer("헤더", { direction: "horizontal", align: "center" }, { height: { mode: "고정", px: 64 } });
      header.background = "#2196f3";
      const logo = createText("로고", "MyApp");
      logo.fontSize = 20;
      logo.bold = true;
      addChild(header, logo);
      
      const main = createContainer("본문", { direction: "vertical" }, { height: { mode: "꽉채움" } });
      main.background = "#fafafa";
      const mainText = createText("본문", "여기에 내용이 들어갑니다.");
      addChild(main, mainText);
      
      const footer = createContainer("푸터", { direction: "horizontal", align: "center" }, { height: { mode: "고정", px: 40 } });
      footer.background = "#eee";
      const footerText = createText("카피라이트", "© 2024");
      addChild(footer, footerText);
      
      addChild(root, header);
      addChild(root, main);
      addChild(root, footer);
      
      editor.setTree(root);
    };
    
    // 초기화
    window.resetToEmpty();
  </script>
</body>
</html>
